<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ecfdf5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#059669" stroke-width="2" />
  
  <!-- Outer Precision Ring -->
  <circle cx="32" cy="32" r="26" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Stylized Sprouting Leaf / Plant -->
  <path d="M32 46C32 46 32 36 32 28C32 20 22 18 18 20C18 26 22 34 32 36" fill="url(#leafGrad)" fill-opacity="0.9" />
  <path d="M32 36C42 34 46 26 46 20C42 18 32 20 32 28C32 36 32 46 32 46" fill="url(#leafGrad)" />
  
  <!-- Central Stem & Growth Line -->
  <path d="M32 46V20M32 20C32 14 38 12 42 12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Soil / Seed Base Arc -->
  <circle cx="32" cy="46" r="3.5" fill="#fbbf24" filter="url(#glow)" />
</svg>